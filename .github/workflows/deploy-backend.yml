name: Deploy Backend to VM

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - 'infra/**'
      - '.github/workflows/deploy-backend.yml'
  workflow_dispatch:
    inputs:
      force_build_all:
        description: 'Force rebuild of all 8 microservices regardless of changes'
        required: true
        default: false
        type: boolean
      deploy_to_vm:
        description: 'Deploy to Azure VM after image build'
        required: true
        default: true
        type: boolean

concurrency:
  group: cd-backend-production
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  OWNER: ${{ github.repository_owner }}

jobs:
  detect-changed-services:
    name: Detect Changed Backend Services
    runs-on: ubuntu-latest
    outputs:
      services: ${{ steps.set-matrix.outputs.services }}
      has_changes: ${{ steps.set-matrix.outputs.has_changes }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Filter Service Changes
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            api-gateway:
              - 'backend/services/api-gateway/**'
              - 'backend/docker-compose.prod.yml'
            auth:
              - 'backend/services/auth/**'
              - 'backend/docker-compose.prod.yml'
            channel:
              - 'backend/services/channel/**'
              - 'backend/docker-compose.prod.yml'
            trend:
              - 'backend/services/trend/**'
              - 'backend/docker-compose.prod.yml'
            strategy:
              - 'backend/services/strategy/**'
              - 'backend/docker-compose.prod.yml'
            planner:
              - 'backend/services/planner/**'
              - 'backend/docker-compose.prod.yml'
            analytics:
              - 'backend/services/analytics/**'
              - 'backend/docker-compose.prod.yml'
            ml:
              - 'backend/services/ml/**'
              - 'backend/docker-compose.prod.yml'

      - name: Compute Build Matrix
        id: set-matrix
        run: |
          FORCE_ALL="${{ inputs.force_build_all }}"
          SERVICES=()

          ALL_SERVICES=("api-gateway" "auth" "channel" "trend" "strategy" "planner" "analytics" "ml")

          if [ "$FORCE_ALL" = "true" ]; then
            SERVICES=("${ALL_SERVICES[@]}")
          else
            for svc in "${ALL_SERVICES[@]}"; do
              if [ "${{ steps.filter.outputs[svc] }}" = "true" ]; then
                SERVICES+=("$svc")
              fi
            done
          fi

          # If triggered by a push and no specific service changed (e.g. only infra changed),
          # default to empty or build all if desired.
          if [ ${#SERVICES[@]} -eq 0 ]; then
            echo "services=[]" >> $GITHUB_OUTPUT
            echo "has_changes=false" >> $GITHUB_OUTPUT
          else
            JSON_SERVICES=$(printf '%s\n' "${SERVICES[@]}" | jq -R . | jq -s -c .)
            echo "services=$JSON_SERVICES" >> $GITHUB_OUTPUT
            echo "has_changes=true" >> $GITHUB_OUTPUT
            echo "Target build services: $JSON_SERVICES"
          fi

  build-and-push:
    name: Build & Push (${{ matrix.service }})
    needs: detect-changed-services
    if: needs.detect-changed-services.outputs.has_changes == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJson(needs.detect-changed-services.outputs.services) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute lowercase repository owner
        id: repo_owner
        run: |
          echo "owner=${OWNER,,}" >> $GITHUB_OUTPUT

      - name: Build and push container image
        uses: docker/build-push-action@v5
        with:
          context: ./backend/services/${{ matrix.service }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ steps.repo_owner.outputs.owner }}/creatoriq-${{ matrix.service }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ steps.repo_owner.outputs.owner }}/creatoriq-${{ matrix.service }}:sha-${{ github.sha }}
            ${{ env.REGISTRY }}/${{ steps.repo_owner.outputs.owner }}/creatoriq-${{ matrix.service }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-vm:
    name: Zero-Downtime Rollout to Azure VM
    needs: [detect-changed-services, build-and-push]
    if: |
      always() &&
      (needs.detect-changed-services.result == 'success') &&
      (needs.build-and-push.result == 'success' || needs.build-and-push.result == 'skipped') &&
      (github.event_name == 'push' || inputs.deploy_to_vm == true)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check for SSH Private Key Secret
        id: check_ssh
        run: |
          if [ -n "${{ secrets.SSH_PRIVATE_KEY }}" ]; then
            echo "has_key=true" >> $GITHUB_OUTPUT
          else
            echo "has_key=false" >> $GITHUB_OUTPUT
            echo "::warning::SSH_PRIVATE_KEY is not set in repository secrets. Skipping VM deployment step."
          fi

      - name: Configure SSH Key & Host Verification
        if: steps.check_ssh.outputs.has_key == 'true'
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/ciq_key.pem
          chmod 600 ~/.ssh/ciq_key.pem
          ssh-keyscan -H 172.198.162.160 >> ~/.ssh/known_hosts

      - name: Sync Production Compose & Deploy Script
        if: steps.check_ssh.outputs.has_key == 'true'
        run: |
          scp -i ~/.ssh/ciq_key.pem backend/docker-compose.prod.yml ubuntu@172.198.162.160:/opt/creatoriq/backend/docker-compose.prod.yml
          scp -i ~/.ssh/ciq_key.pem backend/scripts/deploy.sh ubuntu@172.198.162.160:/opt/creatoriq/backend/scripts/deploy.sh
          ssh -i ~/.ssh/ciq_key.pem ubuntu@172.198.162.160 "chmod +x /opt/creatoriq/backend/scripts/deploy.sh"

      - name: Trigger Rollout on VM
        if: steps.check_ssh.outputs.has_key == 'true'
        run: |
          ssh -i ~/.ssh/ciq_key.pem ubuntu@172.198.162.160 << 'EOF'
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin || true
            /opt/creatoriq/backend/scripts/deploy.sh
          EOF

      - name: End-to-End Public HTTPS Health Assertion
        if: steps.check_ssh.outputs.has_key == 'true'
        run: |
          echo "Asserting health of public endpoint: https://api.ciq.yashparmar.in/v1/auth/health..."
          for i in {1..12}; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://api.ciq.yashparmar.in/v1/auth/health || true)
            if [ "$STATUS" = "200" ]; then
              echo "  [SUCCESS] Endpoint https://api.ciq.yashparmar.in is live and healthy! HTTP 200"
              exit 0
            fi
            echo "  Attempt $i/12: received HTTP $STATUS, retrying in 5s..."
            sleep 5
          done
          echo "::warning::Health check did not return HTTP 200 within timeout."
