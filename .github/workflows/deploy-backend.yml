name: Deploy CreatorIQ Backend

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - 'infra/**'
      - '.github/workflows/deploy-backend.yml'
  workflow_dispatch:
    inputs:
      deploy_to_vm:
        description: 'Deploy to VM after build'
        required: true
        default: true
        type: boolean

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  OWNER: ${{ github.repository_owner }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - api-gateway
          - auth
          - channel
          - trend
          - strategy
          - planner
          - analytics
          - ml
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase repository owner for image tagging
        id: repo_owner
        run: |
          echo "owner=${OWNER,,}" >> $GITHUB_OUTPUT

      - name: Build and push microservice image
        uses: docker/build-push-action@v5
        with:
          context: ./backend/services/${{{ matrix.service }}}
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ steps.repo_owner.outputs.owner }}/creatoriq-${{ matrix.service }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ steps.repo_owner.outputs.owner }}/creatoriq-${{ matrix.service }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-vm:
    needs: build-and-push
    if: github.event_name == 'push' || inputs.deploy_to_vm == true
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup SSH Key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H 172.198.162.160 >> ~/.ssh/known_hosts

      - name: Sync Compose File & Deploy Script to VM
        run: |
          scp -i ~/.ssh/id_rsa backend/docker-compose.prod.yml ubuntu@172.198.162.160:/opt/creatoriq/backend/docker-compose.prod.yml
          scp -i ~/.ssh/id_rsa backend/scripts/deploy.sh ubuntu@172.198.162.160:/opt/creatoriq/backend/scripts/deploy.sh
          ssh -i ~/.ssh/id_rsa ubuntu@172.198.162.160 "chmod +x /opt/creatoriq/backend/scripts/deploy.sh"

      - name: Log in to GHCR on VM and Execute Deployment
        run: |
          ssh -i ~/.ssh/id_rsa ubuntu@172.198.162.160 << 'EOF'
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin || true
            /opt/creatoriq/backend/scripts/deploy.sh
          EOF

      - name: Health Check Public HTTPS Endpoint
        run: |
          echo "Verifying public API health at https://api.ciq.yashparmar.in..."
          for i in {1..10}; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://api.ciq.yashparmar.in/v1/auth/health || true)
            if [ "$STATUS" = "200" ]; then
              echo "Public endpoint is healthy! HTTP 200"
              exit 0
            fi
            echo "Attempt $i/10: received HTTP $STATUS, retrying in 5s..."
            sleep 5
          done
          echo "Warning: Public endpoint did not return 200 within timeout."
