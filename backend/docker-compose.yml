name: creatoriq-backend

# Shared environment for all services (overrides .env host-specific values like Azure DB / 127.0.0.1 URLs)
x-common-env: &common-env
  ENVIRONMENT: ${ENVIRONMENT:-development}
  LOG_LEVEL: INFO
  DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://creatoriq:creatoriq@postgres:5432/creatoriq}
  REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
  JWT_ISSUER: ${JWT_ISSUER:-creatoriq-auth}
  JWT_AUDIENCE: ${JWT_AUDIENCE:-creatoriq-api}
  JWT_PUBLIC_KEY_PATH: ${JWT_PUBLIC_KEY_PATH:-/run/secrets/jwt_public.pem}
  JWT_PRIVATE_KEY_PATH: ${JWT_PRIVATE_KEY_PATH:-/run/secrets/jwt_private.pem}
  AUTH_SERVICE_URL: ${AUTH_SERVICE_URL:-http://auth:8001}
  CHANNEL_SERVICE_URL: ${CHANNEL_SERVICE_URL:-http://channel:8002}
  TREND_SERVICE_URL: ${TREND_SERVICE_URL:-http://trend:8003}
  STRATEGY_SERVICE_URL: ${STRATEGY_SERVICE_URL:-http://strategy:8004}
  PLANNER_SERVICE_URL: ${PLANNER_SERVICE_URL:-http://planner:8005}
  ANALYTICS_SERVICE_URL: ${ANALYTICS_SERVICE_URL:-http://analytics:8006}
  ML_SERVICE_URL: ${ML_SERVICE_URL:-http://ml:8007}
  QDRANT_URL: ${QDRANT_URL:-http://qdrant:6333}
  FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
  GOOGLE_OAUTH_REDIRECT_URI: ${GOOGLE_OAUTH_REDIRECT_URI:-http://localhost:8000/v1/auth/google/callback}

x-service-defaults: &service-defaults
  env_file:
    - ./.env
  environment:
    <<: *common-env
  networks:
    - creatoriq-net
  restart: unless-stopped

services:
  postgres:
    image: postgres:16-alpine
    container_name: ciq-postgres
    environment:
      POSTGRES_DB: creatoriq
      POSTGRES_USER: creatoriq
      POSTGRES_PASSWORD: creatoriq
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - creatoriq-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U creatoriq -d creatoriq"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: ciq-redis
    ports:
      - "6379:6379"
    networks:
      - creatoriq-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:v1.11.0
    container_name: ciq-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - creatoriq-net
    healthcheck:
      test: ["CMD-SHELL", "timeout 5 bash -c '</dev/tcp/localhost/6333' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  auth:
    <<: *service-defaults
    build: ./services/auth
    container_name: ciq-auth
    volumes:
      - ./secrets:/run/secrets:ro
    ports:
      - "8001:8001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  channel:
    <<: *service-defaults
    build: ./services/channel
    container_name: ciq-channel
    ports:
      - "8002:8002"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  ml:
    <<: *service-defaults
    build: ./services/ml
    container_name: ciq-ml
    ports:
      - "8007:8007"
    depends_on:
      postgres:
        condition: service_healthy

  trend:
    <<: *service-defaults
    build: ./services/trend
    container_name: ciq-trend
    ports:
      - "8003:8003"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      ml:
        condition: service_started

  strategy:
    <<: *service-defaults
    build: ./services/strategy
    container_name: ciq-strategy
    ports:
      - "8004:8004"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      ml:
        condition: service_started

  planner:
    <<: *service-defaults
    build: ./services/planner
    container_name: ciq-planner
    ports:
      - "8005:8005"
    depends_on:
      postgres:
        condition: service_healthy

  analytics:
    <<: *service-defaults
    build: ./services/analytics
    container_name: ciq-analytics
    ports:
      - "8006:8006"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  api-gateway:
    <<: *service-defaults
    build: ./services/api-gateway
    container_name: ciq-api-gateway
    volumes:
      - ./secrets:/run/secrets:ro
    ports:
      - "8000:8000"
    depends_on:
      auth:
        condition: service_started
      channel:
        condition: service_started
      trend:
        condition: service_started
      strategy:
        condition: service_started
      planner:
        condition: service_started
      analytics:
        condition: service_started
      ml:
        condition: service_started

  # One-shot schema sync (use: docker compose --profile db-push run --rm db-push-auth)
  db-push-auth:
    profiles: ["db-push"]
    <<: *service-defaults
    restart: "no"
    build: ./services/auth
    command: ["python", "-m", "app.db_push"]
    depends_on:
      postgres:
        condition: service_healthy

  db-push-channel:
    profiles: ["db-push"]
    <<: *service-defaults
    restart: "no"
    build: ./services/channel
    command: ["python", "-m", "app.db_push"]
    depends_on:
      postgres:
        condition: service_healthy

  db-push-trend:
    profiles: ["db-push"]
    <<: *service-defaults
    restart: "no"
    build: ./services/trend
    command: ["python", "-m", "app.db_push"]
    depends_on:
      postgres:
        condition: service_healthy

  db-push-strategy:
    profiles: ["db-push"]
    <<: *service-defaults
    restart: "no"
    build: ./services/strategy
    command: ["python", "-m", "app.db_push"]
    depends_on:
      postgres:
        condition: service_healthy

  db-push-planner:
    profiles: ["db-push"]
    <<: *service-defaults
    restart: "no"
    build: ./services/planner
    command: ["python", "-m", "app.db_push"]
    depends_on:
      postgres:
        condition: service_healthy

  db-push-analytics:
    profiles: ["db-push"]
    <<: *service-defaults
    restart: "no"
    build: ./services/analytics
    command: ["python", "-m", "app.db_push"]
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
  qdrant_data:

networks:
  creatoriq-net:
    driver: bridge
