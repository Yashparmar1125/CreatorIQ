---
- name: Check if swapfile exists
  stat:
    path: /swapfile
  register: swapfile_stat

- name: Create 4GB swapfile if it does not exist
  command: fallocate -l 4G /swapfile
  when: not swapfile_stat.stat.exists

- name: Set correct permissions on swapfile
  file:
    path: /swapfile
    owner: root
    group: root
    mode: '0600'

- name: Make swap on /swapfile
  command: mkswap /swapfile
  when: not swapfile_stat.stat.exists

- name: Enable swapfile
  command: swapon /swapfile
  when: not swapfile_stat.stat.exists

- name: Add swapfile to /etc/fstab
  mount:
    name: none
    src: /swapfile
    fstype: swap
    opts: sw
    state: present

- name: Set swappiness to 10
  sysctl:
    name: vm.swappiness
    value: '10'
    state: present
    reload: yes

- name: Set vfs_cache_pressure to 50
  sysctl:
    name: vm.vfs_cache_pressure
    value: '50'
    state: present
    reload: yes
